schema_version = "1.4"
artifacts = ["/workspace"]

[task]
name = "nl2pcb/mini-led-repair-open"
version = "0.1.0"
description = "5V 单路 LED 电源指示小板：起手板没过公开自检，修复它（L3）"
authors = [{ name = "NL2PCB" }]
keywords = ["pcb", "kicad", "nl2pcb", "L3"]

[metadata]
benchmark = "NL2PCB-Arena"
tier = "L3"
difficulty = "easy"
order = 3
rules_public = ["pcb.drc", "layout.fixed"]
rules_hidden = ["electrical.led.current"]
start_board = "start.kicad_pcb"
agent_image = "nl2pcb-arena/agent:dev"
not_implied = ["从零设计", "可量产、可靠性", "题面里没有对应规则的要求（工艺、焊接方式）"]

[verifier]
timeout_sec = 900.0
env = { NL2PCB_TASK_ID = "mini-led-repair-open" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "nl2pcb-arena/verifier:dev"
network_mode = "no-network"
cpus = 2
memory_mb = 4096

[agent]
timeout_sec = 1800.0
user = "agent"

[environment]
network_mode = "public"
build_timeout_sec = 600.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192

[environment.env]

[solution.env]
